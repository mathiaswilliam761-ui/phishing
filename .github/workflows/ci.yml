name: CI / Automated Testing & Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      test_url:
        description: 'Custom URL to inspect with phishing_checker'
        required: false
        default: 'http://192.0.2.10/account'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Verify dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit test suite
      run: |
        python -m unittest discover -s tests -v

    - name: Smoke test CLI with sample input
      shell: bash
      run: |
        echo "https://www.example.com/login" | python phishing_checker.py || true
        echo "q" | python phishing_checker.py

    - name: Run manual URL inspection (if triggered via workflow_dispatch)
      if: "${{ github.event.inputs.test_url != '' }}"
      shell: bash
      run: |
        echo "Inspecting custom URL: ${{ github.event.inputs.test_url }}"
        echo "${{ github.event.inputs.test_url }}" | python phishing_checker.py || true

  deploy-pages:
    name: Deploy Web Checker to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './web'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
